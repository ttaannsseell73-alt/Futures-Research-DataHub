name: Claude MCP gateway tests
on:
  push:
    branches: [claude-mcp-gateway]
    paths:
      - 'claude_mcp_gateway/**'
      - '.github/workflows/claude-mcp-gateway-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: claude_mcp_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q server.py test_gateway.py
      - name: Run gateway tests
        run: python -m unittest -v test_gateway
