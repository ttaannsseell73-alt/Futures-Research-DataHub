services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.online
    command: ["datahub-api"]
    environment:
      DATAHUB_DATA_ROOT: /cache/datahub
      DATAHUB_API_TOKEN: ${DATAHUB_API_TOKEN}
      DATAHUB_S3_BUCKET: ${DATAHUB_S3_BUCKET}
      DATAHUB_S3_PREFIX: ${DATAHUB_S3_PREFIX:-binance-usdm}
      DATAHUB_S3_ENDPOINT_URL: ${DATAHUB_S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - datahub-cache:/cache/datahub
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.online
    command: ["datahub-worker"]
    environment:
      DATAHUB_DATA_ROOT: /cache/datahub
      DATAHUB_RESEARCH_EXECUTOR: ${DATAHUB_RESEARCH_EXECUTOR}
      DATAHUB_S3_BUCKET: ${DATAHUB_S3_BUCKET}
      DATAHUB_S3_PREFIX: ${DATAHUB_S3_PREFIX:-binance-usdm}
      DATAHUB_S3_ENDPOINT_URL: ${DATAHUB_S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - datahub-cache:/cache/datahub
    restart: unless-stopped

volumes:
  datahub-cache:
