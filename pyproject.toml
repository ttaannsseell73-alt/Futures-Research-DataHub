[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-research-datahub"
version = "0.2.0"
description = "Versioned, validated Binance USD-M research data; no strategies"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18,<24", "polars>=1.20,<2", "duckdb>=1.2,<2", "httpx>=0.28,<1", "filelock>=3.17,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
datahub = "datahub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
