# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# FREE-ONLY deployment policy:
# - one Render Free web service
# - no persistent disks
# - no paid Render datastore
# - durable market data must live in an external S3-compatible free tier

previews:
  generation: off

services:
  - type: web
    name: futures-datahub-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.online
    dockerContext: .
    dockerCommand: datahub-api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATAHUB_DATA_ROOT
        value: /tmp/datahub
      - key: DATAHUB_PUBLIC_READ
        value: "true"
      - key: DATAHUB_API_TOKEN
        generateValue: true
